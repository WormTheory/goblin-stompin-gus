<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Generator · Goblin-Stompin' Gus</title>
<!-- The World Generator: a map of any seed's world, worked out by the game's own world generation. gen-worker.js loads
     ../index.html (the game this page sits beside, so /test/WorldGen/ shows the test build's worlds) in a worker and
     answers for pieces of the map; this page asks for what's in view and draws it. Nothing here is a copy of the game. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9eee2;--panel:#fbfcf8;--fg:#1d2318;--muted:#5b6553;--line:#cdd6c3;--accent:#b8321f;--chip:#eef2e8;--chipOn:#24301d;--chipOnFg:#f3f6ee;--void:#3a3b38;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#11160f;--panel:#1a2117;--fg:#e6ecdf;--muted:#9aa68f;--line:#33402d;--accent:#f0745c;--chip:#232c1f;--chipOn:#d9e4cc;--chipOnFg:#141a11;color-scheme:dark}}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--fg);font:14px/1.4 var(--body);overflow:hidden}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--void)}
#map.drag{cursor:grabbing}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:min(320px,calc(100vw - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.body{display:flex;flex-direction:column;gap:12px}
.panel.min .body{display:none}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;margin:0;letter-spacing:.01em}
.sub{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.sub a{color:inherit}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
button{font-family:var(--body)}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:7px;font:600 13px var(--body);padding:7px 10px;cursor:pointer}
.btn.small{font-size:12px;padding:4px 8px;border-radius:6px}
.btn.go{background:var(--chipOn);color:var(--chipOnFg);border-color:var(--chipOn)}
.row{display:flex;gap:6px;flex-wrap:wrap}
input[type=text],input[type=search]{flex:1;min-width:0;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:14px var(--body);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative}
#q{width:100%}
#hits{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:7px;max-height:240px;overflow:auto;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#hits button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:7px 10px;font:14px var(--body);cursor:pointer}
#hits button:hover,#hits button.on{background:var(--chip)}
#hits small,.muted{color:var(--muted)}
.lbl{font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
summary.lbl{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;margin:0}
summary.lbl::-webkit-details-marker{display:none}
summary.lbl::before{content:"";border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open]>summary.lbl{margin-bottom:6px}
details[open]>summary.lbl::before{transform:rotate(90deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 10px 5px 7px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.5}
.chip.seg{padding:5px 11px}
.chip.seg[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnFg);border-color:var(--chipOn)}
.sw{width:14px;height:14px;flex:none;display:inline-block}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:7px;min-width:0}
#place{border-top:1px solid var(--line);padding-top:10px}
#place h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.05}
#place .kinds{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.zoom{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 20px var(--body);cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#busy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 52px);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 12px var(--body);box-shadow:0 3px 12px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;line-height:1.45;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:260px;z-index:5;font-variant-numeric:tabular-nums}
#tip b{font-family:var(--display);font-size:16px;font-weight:700}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:#f2f0e6;font:600 18px var(--display);letter-spacing:.06em;text-transform:uppercase;pointer-events:none;text-align:center;padding:0 24px}
.sliders{display:grid;grid-template-columns:auto 1fr 3.2em;gap:4px 10px;align-items:center;font-size:12.5px}
.sliders input{width:100%;min-width:0;margin:0;accent-color:var(--chipOn);height:28px}
.sliders output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
#seaReset,#climReset,#shapeReset{margin-top:8px}
.biokey{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px;color:var(--muted);margin-top:6px}
.biokey span{display:flex;align-items:center;gap:6px}.biokey i{width:12px;height:12px;border-radius:3px;flex:none}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.ramp i{flex:1;height:10px;border-radius:3px}
@media (prefers-reduced-motion:reduce){summary.lbl::before{transition:none}}
</style>
</head>
<body>
<canvas id="map" aria-label="World map"></canvas>
<div id="msg">Loading the game…</div>
<div class="panel" id="panel">
  <div class="head">
    <div><h1>World Generator</h1><div class="sub" id="sub"><a href="../">Play the game</a></div></div>
    <button class="btn small" id="collapse" aria-expanded="true">Hide</button>
  </div>
  <div class="body">
    <form class="row" id="seedForm">
      <input type="text" id="seedIn" inputmode="numeric" aria-label="Seed" placeholder="Seed">
      <button class="btn go" type="submit">Show</button>
      <button class="btn" type="button" id="rand">Random</button>
      <button class="btn" type="button" id="mine" hidden>My world</button>
    </form>
    <div class="search"><input id="q" type="search" placeholder="Find a settlement" autocomplete="off" aria-label="Find a settlement"><div id="hits" hidden></div></div>
    <div id="place" hidden></div>
    <div><div class="lbl">Show</div><div class="chips" id="layers"></div></div>
    <div><div class="lbl">Ground</div><div class="chips" id="ground"></div></div>
    <div><div class="lbl">Climate</div><div class="chips" id="climate"></div><div class="ramp" id="climKey" hidden><span></span><i></i><span></span></div><div class="biokey" id="bioKey" hidden></div></div>
    <details id="seabox"><summary class="lbl">Land &amp; sea</summary><div class="sliders" id="sliders"></div><button class="btn small" id="seaReset" type="button">Default</button></details>
    <details id="shapebox"><summary class="lbl">Land shape</summary><div class="sliders" id="shsliders"></div><button class="btn small" id="shapeReset" type="button">Default</button></details>
    <details id="rivbox"><summary class="lbl">Rivers</summary><div class="sliders" id="rvsliders"></div><button class="btn small" id="rivReset" type="button">Default</button></details>
    <details id="climbox"><summary class="lbl">Climate</summary><div class="sliders" id="clsliders"></div><button class="btn small" id="climReset" type="button">Default</button></details>
    <details id="keybox" open><summary class="lbl">Key</summary><div class="legend" id="legend"></div></details>
  </div>
</div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zhome" aria-label="Back to the start">⌂</button></div>
<div id="busy" hidden></div>
<div id="tip" hidden></div>
<script>
(function(){
'use strict';
const cv=document.getElementById('map'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
const SEA='#2c5d8f',SHALLOW='#4f7fae',LAND='#aac484',BASEC='#c8282a',NAVYC='#1e3caa',CVC='#ff8c00';
const ZCOL={1:SEA,2:'#78a0be',3:LAND,4:'#e2d39a',5:'#4a86c0',10:'#5c5c68',11:'#82828e',12:'#c4b89e',13:'#c9a070',14:'#d6be8c',20:'#34425f'};
const TYPE={city:{r:8,c:'#14141c',min:0,blob:'rgba(70,70,82,.75)'},large:{r:6,c:'#46464f',min:0.9,blob:'rgba(110,110,122,.7)'},small:{r:4.5,c:'#8c5020',min:2.2,blob:'rgba(201,160,112,.8)'},village:{r:3.5,c:'#96782f',min:3.6,blob:'rgba(214,190,140,.85)'}};
const CT=256,DT=32,DETAIL=4;   // (overview tiles and detail tiles, in plots; detail from this many pixels a plot)
// (plot kinds by name, one of a kind: the game's own lists are plural)
const ONE={sitdown:'Sit-down restaurant',news:'TV news station',garage:'Car park',drug:'Drugstore',market:'Supermarket',mega:'Mega-building',nasa:'Launch site',thieves:"Thieves' hideout",bigpark:'Big park',ikea:'Furniture superstore',campus:'University',water:'Water works',bigbox:'Superstore',yard:'Shipping port',navy:'Naval base',capitol:'The capitol',harbor:'Docks',homes:'Houses',shops:'Little shops',tower:'Office tower',mid:'Mid-rise block',food:'Restaurant',fastfood:'Fast food',build:'Construction site',court:'Basketball court',plains:'Open country',ramp:'Highway ramp',rail:'Railway',metro:'Subway entrance',sea:'Sea',shore:'Shore',basin:'Harbour',nbasin:'Naval harbour',beach:'Beach',river:'River',park:'Park',plaza:'Plaza',wtower:'Water tower',bell:'Bell tower',ruins:'Ruins'};
let LABELS={},MAPC={};
const sing=n=>n.replace(/ies$/,'y').replace(/(ch|sh|x|ss)es$/,'$1').replace(/s$/,'');
const label=k=>ONE[k]||(LABELS[k]?sing(LABELS[k]):k);

// ---- the worker running the game's world generation ----
// (two of them: one for the land alone, so the coastlines keep coming in while the other works out what stands on them)
let W=null,LW=null,wid=0,P=new Map(),gen=0,ready=false,info=null;
function call(m,w){return new Promise((a,b)=>{m.id=++wid;P.set(wid,[a,b]);(w||W).postMessage(m);});}
function worker(){const w=new Worker('gen-worker.js');w.onmessage=e=>{const p=P.get(e.data.id);if(!p)return;P.delete(e.data.id);e.data.err!==undefined?p[1](e.data.err):p[0](e.data.ok);};return w;}
// ---- what's been worked out so far, by tile ----
let LANDT=new Map(),CLIMT=new Map(),SITET=new Map(),DET=new Map(),setsAll=new Map(),bases=[],navy=[],cvs=[],rivers=[];
let curSeed=0;
async function start(seed){
  curSeed=seed;clearTimeout(seaT);
  if(W)W.terminate();if(LW&&LW!==W)LW.terminate();const g=++gen;ready=false;P.forEach(p=>p[1]('stopped'));P=new Map();
  LANDT=new Map();CLIMT=new Map();SITET=new Map();DET=new Map();setsAll=new Map();bases=[];navy=[];cvs=[];rivers=[];selected=null;placeEl.hidden=true;busy=0;lbusy=0;
  msg.textContent='Loading the game…';msg.hidden=false;draw();
  W=worker();LW=worker();
  W.onerror=e=>{msg.hidden=false;msg.textContent="The map couldn't be made: "+(e.message||'the game failed to load');};
  const url=new URL('../index.html',location.href).href,sea=seaSent(),lw=LW,li=call({op:'init',url,seed,sea},lw).catch(()=>null);
  try{info=await call({op:'init',url,seed,sea});}
  catch(err){if(g!==gen)return;msg.hidden=false;msg.textContent="This game build can't be read by the World Generator ("+err+").";return;}
  if(g!==gen)return;
  MAPC=info.mapc||{};LABELS=info.labels||{};ready=true;msg.hidden=true;
  li.then(r=>{if(g!==gen)return;if(!r){lw.terminate();if(LW===lw)LW=W;}pump();});
  if(LW!==W)LW.ready=false;li.then(r=>{if(r&&LW===lw)lw.ready=true;});
  seedIn.value=seed;try{history.replaceState(null,'','?seed='+seed+seaQuery());}catch(e){}
  draw();pump();
}

// ---- Land & sea and Climate: the game's WORLD_CFG (world/coast.js), the defaults leaving the world as the game makes it ----
// (each range is as far as the start can still always be found inland with a coast in reach)
const SEA_S=[['land','Land',-2.5,2.5,0.1,0],['size','Continent size',0.4,1.8,0.05,1],['rough','Coastline roughness',0,2.5,0.1,1],['chan','Ocean channels',0,2.5,0.1,1],['isles','Island chains',0,3,0.1,1],['islz','Island size',0.6,3,0.1,1],
  ['temp','Temperature',-0.4,0.4,0.02,0,'clim'],['rain','Rainfall',-0.4,0.4,0.02,0,'clim'],['czone','Climate zone size',0.4,2.5,0.1,1,'clim'],['lat','Latitude bands',0,4,0.1,1,'clim'],
  ['mtn','Mountains',-0.5,0.5,0.05,0,'shape'],['mth','Mountain height',0.3,1.2,0.05,1,'shape'],['hill','Hilliness',0,3,0.1,1,'shape'],['lakes','Lakes',0,3,0.1,1,'shape'],
  ['riv','How often',0,2.2,0.1,1,'riv'],['rmd','Meandering',0,3,0.1,1,'riv'],['rwd','Wandering',0,3,0.1,1,'riv'],['rwid','Width',0.5,2,0.05,1,'riv']];
const SEAC={},seaIn={},seaOut={};
SEA_S.forEach(([k,,lo,hi,st,d])=>SEAC[k]=d);
const seaFmt=(k,v)=>k==='land'||k==='temp'||k==='rain'||k==='mtn'?(v>0?'+':'')+v.toFixed(k==='land'?1:2):'×'+v.toFixed(k==='size'||k==='mth'||k==='rwid'?2:1);
function seaSent(){const o={};let any=false;SEA_S.forEach(([k,,,,,d])=>{if(SEAC[k]!==d){o[k]=SEAC[k];any=true;}});return any?o:undefined;}
function seaQuery(){const o=seaSent();return o?Object.keys(o).map(k=>'&'+k+'='+o[k]).join(''):'';}
function seaSet(k,v){const s=SEA_S.find(r=>r[0]===k);if(!s||!isFinite(v))return;v=Math.round(Math.max(s[2],Math.min(s[3],v))/s[4])*s[4];SEAC[k]=+v.toFixed(2);}
let seaT=0;
function seaRedo(){clearTimeout(seaT);seaT=setTimeout(()=>start(curSeed),250);}
const slEl=document.getElementById('sliders'),clSlEl=document.getElementById('clsliders'),shSlEl=document.getElementById('shsliders'),rvSlEl=document.getElementById('rvsliders');
SEA_S.forEach(([k,name,lo,hi,st,,grp])=>{
  const id='sea_'+k,l=document.createElement('label'),i=document.createElement('input'),o=document.createElement('output');
  l.htmlFor=id;l.textContent=name;i.type='range';i.id=id;i.min=lo;i.max=hi;i.step=st;o.htmlFor=id;
  i.oninput=()=>{seaSet(k,+i.value);o.textContent=seaFmt(k,SEAC[k]);};
  i.onchange=()=>{i.oninput();seaRedo();};
  (grp==='clim'?clSlEl:grp==='shape'?shSlEl:grp==='riv'?rvSlEl:slEl).append(l,i,o);seaIn[k]=i;seaOut[k]=o;
});
function seaShow(){SEA_S.forEach(([k])=>{seaIn[k].value=SEAC[k];seaOut[k].textContent=seaFmt(k,SEAC[k]);});}
// (each box's Default puts back only its own)
const seaDef=g=>{let ch=false;SEA_S.forEach(([k,,,,,d,grp])=>{if((grp||'sea')===g&&SEAC[k]!==d){SEAC[k]=d;ch=true;}});if(ch){seaShow();seaRedo();}};
document.getElementById('seaReset').onclick=()=>seaDef('sea');
document.getElementById('climReset').onclick=()=>seaDef('clim');
document.getElementById('shapeReset').onclick=()=>seaDef('shape');
document.getElementById('rivReset').onclick=()=>seaDef('riv');

// ---- view: centre (plots) and scale (CSS pixels a plot) ----
let dpr=1,vw=0,vh=0,cx=0,cz=0,sc=0.9;
const SMIN=0.01,SMAX=96;
// (the land's level for this zoom: about a sample a pixel; the settlements, bases and rivers only once they'd be readable)
const LMAX=6,landLv=()=>Math.max(0,Math.min(LMAX,Math.floor(Math.log2(1/(2*sc))))),SITES=0.1,THIN=0.5;   // (below THIN, markers that would land on one already drawn are left out)
function home(){const off=vw>760?350:0;sc=Math.min(1.1,Math.max(0.35,Math.min(vw-off,vh)/900));cx=-(off/2)/sc;cz=0;}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);vw=innerWidth;vh=innerHeight;cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);draw();pump();}
const sx=x=>(x-cx)*sc+vw/2,sy=z=>(z-cz)*sc+vh/2,wx=X=>(X-vw/2)/sc+cx,wz=Y=>(Y-vh/2)/sc+cz;
function viewTiles(T,m){const a=Math.floor(wx(-m)/T),b=Math.floor(wx(vw+m)/T),c=Math.floor(wz(-m)/T),d=Math.floor(wz(vh+m)/T),out=[];
  for(let i=a;i<=b;i++)for(let j=c;j<=d;j++)out.push([i,j]);const mx=cx/T,mz=cz/T;out.sort((p,q)=>Math.hypot(p[0]+.5-mx,p[1]+.5-mz)-Math.hypot(q[0]+.5-mx,q[1]+.5-mz));return out;}

// ---- asking for what's in view: the land everywhere first, then what's on it, then the detail ----
let busy=0,lbusy=0;const busyEl=document.getElementById('busy');
const landKey=(L,i,j)=>L+'|'+i+','+j;
// (the climate's tiles too, while it's shown: on the same worker, after the land)
function landJobs(){const L=landLv(),T=CT<<L,out=[],V=viewTiles(T,64);for(const [i,j] of V)if(!LANDT.has(landKey(L,i,j)))out.push({op:'land',tx:i,tz:j,L});
  if(climWanted())for(const [i,j] of V)if(!CLIMT.has(landKey(L,i,j)))out.push({op:'clim',tx:i,tz:j,L});return out;}
function siteJob(count){let n=0,job=null;
  if(sc>=SITES)for(const [i,j] of viewTiles(CT,64))if(!SITET.has(i+','+j)){n++;if(!job)job={op:'coarse',tx:i,tz:j};if(!count)return job;}
  if(sc>=DETAIL)for(const [i,j] of viewTiles(DT,0))if(!DET.has(i+','+j)){n++;if(!job)job={op:'detail',tx:i,tz:j};if(!count)return job;}
  return count?n:job;}
function pump(){
  if(!ready)return;
  const lj=landJobs(),landW=LW&&LW!==W&&LW.ready?LW:W;
  // (the land first: on the land worker if it's up, or before anything else on the one worker)
  if(lj.length&&!lbusy&&(landW!==W||!busy)){const job=lj[0],g=gen,key=landKey(job.L,job.tx,job.tz),own=landW!==W;if(own)lbusy=1;else busy=1;
    const done=()=>{if(own)lbusy=0;else busy=0;};
    call(job,landW).then(r=>{if(g!==gen)return;done();take(job.op,key,r,job);draw();pump();},err=>{if(g!==gen)return;done();(job.op==='clim'?CLIMT:LANDT).set(key,null);console.warn(job.op,key,err);pump();});}
  if(!busy&&(landW!==W||!lj.length)){const job=siteJob(false);
    if(job){busy=1;const g=gen,key=job.tx+','+job.tz;
      call(job).then(r=>{if(g!==gen)return;busy=0;take(job.op,key,r,job);draw();pump();},err=>{if(g!==gen)return;busy=0;
        if(job.op==='coarse')SITET.set(key,true);else DET.set(key,null);console.warn(job.op,key,err);pump();});}}
  const left=lj.length+siteJob(true),op=lj.length?'land':sc>=DETAIL&&!siteJob(false)?'':siteJob(false)?siteJob(false).op:'';
  busyEl.hidden=!left;if(left)busyEl.textContent=(op==='detail'?'Generating detail… ':'Generating the world… ')+left;
}
function hex(c){const n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function paint(N,f){const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N);
  for(let k=0;k<N*N;k++){const [r,g,b]=f(k);im.data[k*4]=r;im.data[k*4+1]=g;im.data[k*4+2]=b;im.data[k*4+3]=255;}x.putImageData(im,0,0);return c;}

  if(show.bases&&sc>=SITES)for(const [ax,az,w,h] of bases){if(!inV(ax+w/2,az+h/2,200))continue;
    let x0=sx(ax),y0=sy(az),ww=w*sc,hh=h*sc;if(ww<9){const m=[x0+ww/2,y0+hh/2];x0=m[0]-4.5;y0=m[1]-4.5;ww=hh=9;}
    if(sc<THIN&&hit([x0,y0,x0+ww,y0+hh]))continue;
    ctx.fillStyle=BASEC;ctx.fillRect(x0,y0,ww,hh);ctx.strokeStyle='#fff';ctx.lineWidth=ww>20?2:1.2;ctx.strokeRect(x0,y0,ww,hh);
    const mx=x0+ww/2,my=y0+hh/2,k=Math.min(ww*.28,12);ctx.beginPath();ctx.moveTo(mx-k,my);ctx.lineTo(mx+k,my);ctx.moveTo(mx,my-k);ctx.lineTo(mx,my+k);ctx.lineWidth=ww>20?3:1.5;ctx.stroke();
    placed.push([x0,y0,x0+ww,y0+hh]);
    if(sc>=10)text('Military base',x0+ww/2,y0-6,'600 12px '+FB,'#7a1010','center');}
  if(show.cv&&sc>=SITES)for(const [x,z,yaw] of cvs){if(!inV(x,z,300))continue;const X=sx(x),Y=sy(z),ux=Math.cos(yaw),uz=-Math.sin(yaw),vx=Math.sin(yaw),vz=Math.cos(yaw);
    let L=250/32*sc/2,Wd=55/32*sc/2;if(L<10){Wd*=10/L;L=10;}
    if(sc<THIN){const b=[X-L-5,Y-L-5,X+L+5,Y+L+5];if(hit(b))continue;placed.push(b);}
    if(sc<6){ctx.beginPath();ctx.arc(X,Y,L+5,0,7);ctx.strokeStyle=CVC;ctx.lineWidth=2.5;ctx.stroke();}
    ctx.beginPath();for(const [a,b] of [[1,.6],[.8,1],[-1,1],[-1,-1],[.8,-1],[1,-.6]])ctx.lineTo(X+ux*L*a+vx*Wd*b,Y+uz*L*a+vz*Wd*b);ctx.closePath();
    ctx.fillStyle=CVC;ctx.fill();ctx.strokeStyle='#402000';ctx.lineWidth=1.5;ctx.stroke();
    if(sc>=6)text('Carrier spawn',X+L*.4+Wd+6,Y+4,'600 12px '+FB,'#6a3500');}
  if(show.navy&&sc>=SITES)for(const [x,z] of navy){if(!inV(x,z,60))continue;const X=sx(x),Y=sy(z),r=sc<3?7:11;if(sc<THIN&&hit([X-r,Y-r,X+r,Y+r]))continue;
    ctx.beginPath();ctx.moveTo(X,Y-r);ctx.lineTo(X+r,Y);ctx.lineTo(X,Y+r);ctx.lineTo(X-r,Y);ctx.closePath();ctx.fillStyle=NAVYC;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    if(r>8){ctx.font='700 11px '+FB;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('N',X,Y+4);}
    placed.push([X-r,Y-r,X+r,Y+r]);if(sc>=6)text('Naval base',X+r+5,Y+4,'600 12px '+FB,'#122a7a');}
  if(show.sets){
    for(const s of vis){const X=sx(s.x),Y=sy(s.z),T=TYPE[s.type]||TYPE.village,r=T.r*ms;
      if(s.cap){star(X,Y,r*2);continue;}
      ctx.beginPath();s.type==='city'?ctx.rect(X-r,Y-r,2*r,2*r):ctx.arc(X,Y,r,0,7);ctx.fillStyle=T.c;ctx.fill();ctx.strokeStyle=selected&&selected.k===s.k?'#ffc800':'#fff';ctx.lineWidth=selected&&selected.k===s.k?3:1.5;ctx.stroke();}
    const kindOn=sc>=1.6;
    for(const s of vis){const X=sx(s.x),Y=sy(s.z),T=TYPE[s.type]||TYPE.village,r=(s.cap?2:1)*T.r*ms;
      const fs=Math.round((s.cap?22:s.type==='city'?18:s.type==='large'?16:s.type==='small'?14:13)*Math.min(1.35,Math.max(1,sc/12)));
      const nf=`${s.type==='city'||s.type==='large'?700:600} ${fs}px ${FD}`,kf=`500 11px ${FB}`;
      ctx.font=nf;const nw=ctx.measureText(s.name).width;ctx.font=kf;const kt=s.kind+(s.cap?' · Capital':''),kw=kindOn?ctx.measureText(kt).width:0;
      const w=Math.max(nw,kw)+4,h=fs+(kindOn?13:0),g=r+5,C=[[X+g,Y-h/2],[X-g-w,Y-h/2],[X-w/2,Y-g-h],[X-w/2,Y+g]];let ok=null;
      for(const [lx,ly] of C){const b=[lx,ly,lx+w,ly+h];if(!hit(b)){ok=b;break;}}
      if(!ok){if(s.cap)ok=[C[0][0],C[0][1],C[0][0]+w,C[0][1]+h];else continue;}
      placed.push(ok);text(s.name,ok[0]+2,ok[1]+fs*.82,nf,s.cap?'#9a1a10':'#121510');if(kindOn)text(kt,ok[0]+2,ok[1]+fs+10,kf,'#3d4436');}}
  // the names of what's on each plot, far in
  if(det&&sc>=18){for(const [i,j] of viewTiles(DT,0)){const d=DET.get(i+','+j);if(!d)continue;
    for(let b=0;b<DT;b++)for(let a=0;a<DT;a++){const k=b*DT+a,n=ptNames[d.pt[k]];if(!n||d.zone[k]===1||/^(plains|homes|shops|park|plaza|mid|tower|ramp|rail|shore|sea|basin|nbasin|beach|river|\?)$/.test(n))continue;
      if(a>0&&d.pt[k-1]===d.pt[k]||b>0&&d.pt[k-DT]===d.pt[k])continue;   // (a site over several plots: named once, at its corner)
      let w2=1,h2=1;while(a+w2<DT&&d.pt[k+w2]===d.pt[k])w2++;while(b+h2<DT&&d.pt[k+h2*DT]===d.pt[k])h2++;
      const x=i*DT+a+w2/2,z=j*DT+b+h2/2;if(!inV(x,z,40))continue;const t=label(n),X=sx(x),Y=sy(z);
      ctx.font='600 12px '+FB;const w=ctx.measureText(t).width+6,bx=[X-w/2,Y-9,X+w/2,Y+6];if(hit(bx))continue;placed.push(bx);text(t,X,Y+3,'600 12px '+FB,'#2a2416','center');}}}
  // scale bar
  {const target=120/sc*32,nice=[10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000,200000,500000,1000000,2000000];const m=nice.find(v=>v>=target)||2000000,px=m/32*sc,bx=vw-76-px,by=vh-22;
   ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(bx-8,by-22,px+16,30);ctx.fillStyle='#1d2318';ctx.fillRect(bx,by,px,4);ctx.font='600 12px '+FB;ctx.textAlign='center';ctx.fillText(m.toLocaleString()+' blocks',bx+px/2,by-7);}
}

// ---- moving about ----
function zoomAt(f,X,Y){const x=wx(X),z=wz(Y);sc=Math.max(SMIN,Math.min(SMAX,sc*f));cx=x-(X-vw/2)/sc;cz=z-(Y-vh/2)/sc;moved();}
function moved(){draw();clearTimeout(moved.t);moved.t=setTimeout(pump,60);}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0016)),e.clientX,e.clientY);},{passive:false});
const ptrs=new Map();let pinch=null,dragged=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragged=0;cv.classList.add('drag');if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p){hover(e);return;}
  if(ptrs.size===2&&pinch){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d;dragged=99;return;}
  const dx=e.clientX-p.x,dy=e.clientY-p.y;dragged+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;cx-=dx/sc;cz-=dy/sc;moved();tip.hidden=true;hq++;});
const up=e=>{const was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)cv.classList.remove('drag');if(was&&e.type==='pointerup'&&dragged<6&&!ptrs.size)click(e);};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',()=>{tip.hidden=true;hq++;});
cv.addEventListener('dblclick',e=>zoomAt(2,e.clientX,e.clientY));
document.getElementById('zin').onclick=()=>zoomAt(1.6,vw/2,vh/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.6,vw/2,vh/2);
document.getElementById('zhome').onclick=()=>{home();moved();};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='+'||e.key==='=')zoomAt(1.4,vw/2,vh/2);else if(e.key==='-')zoomAt(1/1.4,vw/2,vh/2);});

// ---- a settlement: picked on the map or from the search ----
const placeEl=document.getElementById('place');let selected=null;
function nearestSet(X,Y){let best=null,bd=1e9;for(const s of setsAll.values()){if(!s.cap&&(sc<SITES||sc<(TYPE[s.type]||TYPE.village).min))continue;const d=Math.hypot(sx(s.x)-X,sy(s.z)-Y);if(d<bd){bd=d;best=s;}}return bd<Math.max(16,best?best.R*sc:0)?best:null;}
function click(e){if(!ready)return;const s=nearestSet(e.clientX,e.clientY);if(s)pick(s,false);}
async function pick(s,fly){
  selected=s;if(fly){cx=s.x;cz=s.z;sc=Math.max(sc,Math.min(10,Math.max(DETAIL,Math.min(vw,vh)/(s.R*3.2))));moved();}else draw();
  placeEl.hidden=false;placeEl.innerHTML=`<h2>${esc(s.name)}</h2><div class="muted">${esc(s.kind)}${s.cap?' · Capital':''} · x ${Math.floor(s.x*32).toLocaleString()}, z ${Math.floor(s.z*32).toLocaleString()}</div><div class="kinds muted">Counting…</div>`;
  if(panel.classList.contains('min'))toggle();
  const g=gen;let r;try{r=await call({op:'place',k:s.k});}catch(err){return;}if(g!==gen||selected!==s)return;
  const skip=/^(plains|ramp|rail|shore|beach|river|\?)$/;
  const rows=Object.entries(r.kinds).filter(([k])=>!skip.test(k)).sort((a,b)=>b[1]-a[1]);
  placeEl.querySelector('.kinds').outerHTML=`<div class="muted" style="margin-top:4px">${r.plots.toLocaleString()} plots</div><div class="kinds">${rows.map(([k,n])=>`<span>${esc(label(k))}</span><span>${n}</span>`).join('')}</div>`;
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- hover: what this plot is ----
const tip=document.getElementById('tip');let hq=0;
function hover(e){if(!ready)return;const x=wx(e.clientX),z=wz(e.clientY),px=Math.floor(x),pz=Math.floor(z);
  const coords=`<span class="muted">x ${Math.floor(x*32).toLocaleString()}, z ${Math.floor(z*32).toLocaleString()}</span>`;
  const base=bases.find(([ax,az,w,h])=>px>=ax&&px<ax+w&&pz>=az&&pz<az+h),cvn=cvs.find(([a,b])=>Math.hypot(x-a,z-b)<4.5);
  const show2=h=>{tip.innerHTML=h;tip.hidden=false;const tw=tip.offsetWidth,th=tip.offsetHeight;let tx=e.clientX+14,ty=e.clientY+14;if(tx+tw>vw-8)tx=e.clientX-tw-14;if(ty+th>vh-8)ty=e.clientY-th-14;tip.style.left=tx+'px';tip.style.top=ty+'px';};
  if(cvn)return show2(`<b>Aircraft carrier spawn</b><br>${coords}`);
  if(base)return show2(`<b>Military base</b><br>${coords}`);
  // (and the ground's height and biome under the pointer, at any zoom)
  const q=++hq,g=gen,gnd=o=>!o||o.sea?'':`<br>${o.h<0?'Lake':'Height '+o.h}${o.snow?' · snow':o.rock?' · rock':''}${o.tun?' · tunnel':o.cut?' · cutting':''}${o.bio?' · '+esc(o.bio):''}`;
  clearTimeout(hover.t);
  if(sc<DETAIL){const s=nearestSet(e.clientX,e.clientY),top=s?`<b>${esc(s.name)}</b><br><span class="muted">${esc(s.kind)}${s.cap?' · Capital':''}</span><br>`:'';show2(top+coords);
    hover.t=setTimeout(()=>call({op:'pt',x,z}).then(o=>{if(q!==hq||g!==gen)return;show2(top+coords+gnd(o));},()=>{}),40);return;}
  hover.t=setTimeout(()=>Promise.all([call({op:'plot',px,pz}),call({op:'pt',x,z}).catch(()=>null)]).then(([r,o])=>{if(q!==hq||g!==gen)return;
    show2((r.set?`<b>${esc(r.set.name)}</b><br><span class="muted">${esc(r.set.kind)}${r.cap?' · Capital':''}</span><br>`:'')+esc(label(r.t))+'<br>'+coords+gnd(o));},()=>{}),40);}

// ---- search ----
const q=document.getElementById('q'),hits=document.getElementById('hits');let hl=[],hi=0;
async function list(){const t=q.value.trim();if(!t||!ready){hits.hidden=true;return;}const g=gen,v=t;let r;try{r=await call({op:'search',q:t,cx,cz});}catch(e){return;}if(g!==gen||q.value.trim()!==v)return;
  hl=r;hi=0;hits.innerHTML='';if(!hl.length){hits.innerHTML='<div style="padding:8px 10px" class="muted">No settlement by that name nearby</div>';hits.hidden=false;return;}
  hl.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span>${esc(s.name)}</span><small>${esc(s.kind)}${s.cap?' · Capital':''}</small>`;if(i===0)b.classList.add('on');b.onclick=()=>go(s);hits.append(b);});hits.hidden=false;}
function go(s){setsAll.set(s.k,Object.assign(setsAll.get(s.k)||{},s));hits.hidden=true;q.value=s.name;pick(setsAll.get(s.k),true);}
q.addEventListener('input',()=>{clearTimeout(list.t);list.t=setTimeout(list,150);});
q.addEventListener('keydown',e=>{if(hits.hidden)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+hl.length)%hl.length;[...hits.children].forEach((c,i)=>c.classList.toggle('on',i===hi));}else if(e.key==='Enter'&&hl[hi])go(hl[hi]);else if(e.key==='Escape')hits.hidden=true;});

// ---- the seed: from the address, the world you're playing, or a new one ----
const seedIn=document.getElementById('seedIn');
const toSeed=v=>{v=String(v).trim();if(!/^-?\d+$/.test(v))return null;const n=Number(v);return Number.isSafeInteger(n)?n:null;};
document.getElementById('seedForm').addEventListener('submit',e=>{e.preventDefault();const s=toSeed(seedIn.value);if(s===null){seedIn.focus();seedIn.select();return;}home();start(s);});
document.getElementById('rand').onclick=()=>{home();start((Math.random()*1e9)|0);};
// (the world saved in this browser: the game keeps it under 'goblin-city-v' and a number, the newest number is current)
function mySeed(){try{let best=null,bv=-1;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),m=/^goblin-city-v(\d+)/.exec(k||'');if(!m||+m[1]<bv)continue;
  const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&typeof o.seed==='number'&&!o.tenv){best=o.seed;bv=+m[1];}}return best;}catch(e){return null;}}
const my=mySeed(),mineB=document.getElementById('mine');if(my!==null){mineB.hidden=false;mineB.onclick=()=>{home();start(my);};}
const panel=document.getElementById('panel');
function toggle(){const m=panel.classList.toggle('min');const b=document.getElementById('collapse');b.textContent=m?'Show':'Hide';b.setAttribute('aria-expanded',!m);}
document.getElementById('collapse').onclick=toggle;
if(innerWidth<760||innerHeight<700)document.getElementById('keybox').open=false;
if(innerWidth<600||innerHeight<560)toggle();
if(/\/test\/WorldGen/i.test(location.pathname))document.getElementById('sub').insertAdjacentHTML('afterbegin','Test build · ');
else if(/\/hotfix\/WorldGen/i.test(location.pathname))document.getElementById('sub').insertAdjacentHTML('afterbegin','Hotfix build · ');
addEventListener('resize',resize);
vw=innerWidth;vh=innerHeight;home();resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
const usp=new URLSearchParams(location.search),qs=toSeed(usp.get('seed')||'');
SEA_S.forEach(([k])=>{if(usp.has(k))seaSet(k,parseFloat(usp.get(k)));});seaShow();
SEA_S.forEach(([k,,,,,d,grp])=>{if(SEAC[k]!==d)document.getElementById((grp||'sea')+'box').open=true;});
start(qs!==null?qs:my!==null?my:(Math.random()*1e9)|0);
})();
</script>
</body>
