# Publishes the game to GitHub Pages on every push to main or test that changes it.
# main's game/ is the site's root and test's game/ goes under /test/, so either branch can be pushed on its own
# and the other's copy stays as it was. (Every run builds both, from each branch's latest pushed commit.)
# Earlier versions go under /v/<version>/, one for each tag vX, so the Patch notes can link to them
# (tools/archive_versions.py): pushing a new tag republishes too.

name: Deploy game to Pages

on:
  push:
    branches: [main, test]
    tags: ['v*']
    paths:
      - 'game/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# (A newer push replaces a deploy that's still running, so the latest game always wins.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
          fetch-depth: 0   # (all of history and its tags, for the old versions)
      - id: hastest
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" test >/dev/null; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.hastest.outputs.yes == 'true'
        with:
          ref: test
          path: testsrc
          fetch-depth: 0
      - run: |
          mkdir site
          cp -r live/game/. site/
          if [ -d testsrc/game ]; then mkdir -p site/test && cp -r testsrc/game/. site/test/; fi
          # (the archiver comes from main, or from test while main hasn't been pushed with it yet)
          if [ -f live/tools/archive_versions.py ]; then python3 live/tools/archive_versions.py site
          elif [ -f testsrc/tools/archive_versions.py ]; then python3 testsrc/tools/archive_versions.py site; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
