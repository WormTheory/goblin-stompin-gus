<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In-game HUD</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap">
<style>
body{margin:0}
.ui{font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;color:#2b1b2e;position:relative;overflow:hidden}
.px{font-family:'Jersey 10',monospace;font-weight:400!important;letter-spacing:.5px}
.wob{border:4px solid #2b1b2e;border-radius:18px 26px 16px 28px/26px 16px 28px 18px;box-shadow:6px 6px 0 #2b1b2e}
.wob2{border:4px solid #2b1b2e;border-radius:28px 14px 24px 16px/14px 26px 16px 24px;box-shadow:6px 6px 0 #2b1b2e}
.paper{background-color:#fff6dc;background-image:repeating-conic-gradient(rgba(201,138,78,.13) 0 25%,transparent 0 50%);background-size:6px 6px}
.sky{background-color:#a8e0f0;background-image:repeating-conic-gradient(rgba(255,255,255,.18) 0 25%,transparent 0 50%);background-size:8px 8px}
.hill{position:absolute;border:4px solid #2b1b2e;border-radius:50% 50% 0 0/100% 100% 0 0;background-image:radial-gradient(circle,rgba(43,27,46,.22) 3px,transparent 4px);background-size:28px 28px}
.cloud{position:absolute;background:#fff;border:4px solid #2b1b2e;border-radius:40px 46px 38px 44px/30px 34px 28px 32px;box-shadow:inset 0 -8px 0 #d8eef6}
.btn{display:flex;align-items:center;justify-content:center;gap:14px;box-sizing:border-box;font-family:'Jersey 10',monospace;font-weight:400;color:#2b1b2e;text-decoration:none;border:4px solid #2b1b2e;border-radius:22px 30px 20px 32px/30px 20px 32px 22px;box-shadow:0 6px 0 #2b1b2e,inset 0 -7px 0 rgba(0,0,0,.16),inset 0 5px 0 rgba(255,255,255,.5);cursor:pointer}
.btn:nth-child(even){border-radius:30px 20px 32px 22px/20px 30px 22px 32px}
.focus{animation:bob 1.1s ease-in-out infinite;outline:5px dashed #ffd447;outline-offset:6px}
.out{text-shadow:3px 0 #2b1b2e,-3px 0 #2b1b2e,0 3px #2b1b2e,0 -3px #2b1b2e,3px 3px #2b1b2e,-3px 3px #2b1b2e,3px -3px #2b1b2e,-3px -3px #2b1b2e,0 7px #2b1b2e,3px 7px #2b1b2e,-3px 7px #2b1b2e}
.out2{text-shadow:2px 0 #2b1b2e,-2px 0 #2b1b2e,0 2px #2b1b2e,0 -2px #2b1b2e,2px 2px #2b1b2e,-2px 2px #2b1b2e,2px -2px #2b1b2e,-2px -2px #2b1b2e,0 4px #2b1b2e}
.g{display:inline-grid;place-items:center;width:34px;height:34px;border:3px solid #2b1b2e;border-radius:50%;font:400 20px 'Jersey 10',monospace;color:#2b1b2e;box-shadow:0 3px 0 #2b1b2e;flex:none}
.key{display:inline-grid;place-items:center;min-width:34px;height:32px;padding:0 8px;box-sizing:border-box;background:#fff6dc;border:3px solid #2b1b2e;border-radius:6px;box-shadow:0 4px 0 #2b1b2e;font:400 18px 'Jersey 10',monospace;color:#2b1b2e}
.sticker{border:3px solid #2b1b2e;border-radius:10px 14px 9px 15px/14px 9px 15px 10px;box-shadow:4px 4px 0 #2b1b2e}
.wig{animation:wig .9s ease-in-out infinite}
.pop{animation:rise 1.6s ease-out infinite}
.pop2{animation:rise 1.6s ease-out .55s infinite}
.pop3{animation:rise 1.6s ease-out 1.1s infinite}
.squash{animation:squash 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:rotate(-1.5deg) translateY(0) scale(1.04)}50%{transform:rotate(1deg) translateY(-5px) scale(1.04)}}
@keyframes wig{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(4deg) scale(1.1)}}
@keyframes rise{0%{transform:translateY(14px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.25);opacity:1}30%{transform:translateY(-6px) scale(1)}100%{transform:translateY(-54px) scale(1);opacity:0}}
@keyframes squash{0%,70%,100%{transform:scale(1,1)}78%{transform:scale(1.18,.78)}88%{transform:scale(.94,1.08)}}
@keyframes drain{0%{width:100%}100%{width:8%}}
.drain{animation:drain 3s linear infinite}
